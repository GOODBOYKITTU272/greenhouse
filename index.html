<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenhouse Open Jobs Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #2c3e50; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; font-weight: 600; color: #2c3e50; cursor: pointer; }
        tr:hover { background-color: #f1f1f1; }
        a { color: #3498db; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        .badge { background: #e0f2f1; color: #00796b; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Open Jobs Dashboard</h1>
        <p>Showing <span id="count">0</span> jobs from 93 Greenhouse companies.</p>
        <input type="text" id="search" placeholder="Search by job title, company, or location..." onkeyup="filterJobs()">
        <table id="jobsTable">
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Job Title</th>
                    <th>Location</th>
                    <th>Link</th>
                </tr>
            </thead>
            <tbody id="jobsBody">
            </tbody>
        </table>
    </div>
    <script>
        let allJobs = [];
        
        fetch('jobs.json')
            .then(response => response.json())
            .then(data => {
                allJobs = data;
                renderJobs(allJobs);
            });

        function renderJobs(jobs) {
            const tbody = document.getElementById('jobsBody');
            tbody.innerHTML = '';
            document.getElementById('count').innerText = jobs.length;
            
            // Render first 500 to not freeze browser, simple pagination could be added
            const toRender = jobs.slice(0, 500);
            
            toRender.forEach(job => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${job.company_name}</strong></td>
                    <td>${job.job_title}</td>
                    <td><span class="badge">${job.location}</span></td>
                    <td><a href="${job.job_url}" target="_blank">Apply &rarr;</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterJobs() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = allJobs.filter(job => {
                return (job.job_title && job.job_title.toLowerCase().includes(query)) ||
                       (job.company_name && job.company_name.toLowerCase().includes(query)) ||
                       (job.location && job.location.toLowerCase().includes(query));
            });
            renderJobs(filtered);
        }
    </script>
</body>
</html>
