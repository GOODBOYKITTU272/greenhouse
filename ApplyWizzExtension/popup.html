<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; width: 350px; background: #f8f9fa; }
    h2 { margin-top: 0; color: #2c3e50; font-size: 16px; }
    textarea { width: 100%; height: 150px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; font-size: 11px; margin-bottom: 10px; }
    button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
    button:hover { background: #218838; }
    #status { margin-top: 10px; font-size: 12px; color: #d32f2f; font-weight: bold; text-align: center; }
  </style>
</head>
<body>
  <h2>🚀 ApplyWizz Auto-Filler</h2>
  <p style="font-size: 12px; color: #555;">Paste candidate JSON below and click Auto-Fill.</p>
  <textarea id="jsonInput" placeholder="Paste candidate JSON here..."></textarea>
  <button id="fillBtn">Auto-Fill Application</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
