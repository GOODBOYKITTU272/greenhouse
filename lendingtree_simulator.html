<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApplyWizz Bot Simulator - LendingTree</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f4f8; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e1e4e8; }
        .card h2 { margin-top: 0; color: #0366d6; font-size: 18px; border-bottom: 2px solid #0366d6; padding-bottom: 5px; }
        .field { margin-bottom: 12px; }
        .field label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #555; }
        .field input, .field select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; background: #e8f0fe; font-family: monospace; font-size: 13px; }
        .rule-badge { display: inline-block; background: #28a745; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-left: 5px; }
        .warning { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .btn { display: block; width: 100%; padding: 15px; background: #28a745; color: white; text-align: center; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 20px; cursor: not-allowed; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 ApplyWizz Visual Simulator: LendingTree Job</h1>
        <div class="warning">⚠️ SIMULATION ONLY: Reviewing mapping for Yakub before any real application is sent.</div>
        
        <div class="grid">
            <!-- Left Side: ApplyWizz Database -->
            <div class="card">
                <h2>1. ApplyWizz Data + Global Rules</h2>
                <div class="field"><label>Candidate Name</label><input type="text" value="Yakub Ali Mohammed" disabled></div>
                <div class="field"><label>Visa Type</label><input type="text" value="Other" disabled></div>
                <div class="field"><label>Worked for company before?</label><input type="text" value="Null (Auto-mapped to No)" disabled></div>
                <div class="field"><label>Salary Range</label><input type="text" value="USD Yearly: 100k-130k" disabled></div>
                
                <h3 style="font-size: 14px; margin-top: 20px; color: #d73a49;">ApplyWizz Global Rules Applied:</h3>
                <div class="field"><label>Missing 'Source' Question</label><input type="text" value="Company Website" disabled></div>
                <div class="field"><label>Missing 'SMS Opt-In'</label><input type="text" value="Yes" disabled></div>
                <div class="field"><label>Missing Demographics</label><input type="text" value="I prefer not to answer" disabled></div>
            </div>

            <!-- Right Side: The Greenhouse Form -->
            <div class="card">
                <h2>2. What the Bot Fills in LendingTree</h2>
                <div class="field">
                    <label>How did you hear about this job?</label>
                    <input type="text" value="Company Website" disabled>
                </div>
                <div class="field">
                    <label>Have you ever worked for our company before?</label>
                    <select disabled><option selected>No</option></select>
                </div>
                <div class="field">
                    <label>Do you hold temporary authorization (H-1B, OPT, etc)?</label>
                    <select disabled><option selected>Yes (Derived from Visa: 'Other')</option></select>
                </div>
                <div class="field">
                    <label>Are you authorized to work in the United States?</label>
                    <select disabled><option selected>Yes</option></select>
                </div>
                <div class="field">
                    <label>Opt In to receive text message updates?</label>
                    <select disabled><option selected>Yes</option></select>
                </div>
                <div class="field">
                    <label>What are your base salary expectations?</label>
                    <input type="text" value="100k-130k" disabled>
                </div>
                <div class="field">
                    <label>Sexual Orientation / Transgender Status</label>
                    <select disabled><option selected>I prefer not to answer</option></select>
                </div>
                <div class="field">
                    <label>Attached Resume</label>
                    <input type="text" value="resume_yakub-ali-mohammed.pdf (From S3)" disabled>
                </div>
            </div>
        </div>
        
        <div class="btn">BOT ACTION: STEALTH SUBMIT (DISABLED IN SIMULATION)</div>
    </div>
</body>
</html>
