<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApplyWizz Bot Simulator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f4f8; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e1e4e8; }
        .card h2 { margin-top: 0; color: #0366d6; font-size: 18px; border-bottom: 2px solid #0366d6; padding-bottom: 5px; }
        .field { margin-bottom: 15px; }
        .field label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .field input, .field select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; background: #e8f0fe; font-family: monospace; }
        .arrow { display: flex; align-items: center; justify-content: center; font-size: 24px; color: #28a745; font-weight: bold; }
        .warning { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .btn { display: block; width: 100%; padding: 15px; background: #28a745; color: white; text-align: center; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 20px; cursor: not-allowed; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 ApplyWizz Visual Simulator</h1>
        <div class="warning">⚠️ SIMULATION ONLY: No real application is being sent!</div>
        
        <div class="grid">
            <!-- Left Side: ApplyWizz Database -->
            <div class="card">
                <h2>1. ApplyWizz JSON Data (Yakub)</h2>
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" value="Yakub Ali Mohammed" disabled>
                </div>
                <div class="field">
                    <label>Visa Type</label>
                    <input type="text" value="Other" disabled>
                </div>
                <div class="field">
                    <label>Willing to Relocate (JSON)</label>
                    <input type="text" value="False" disabled>
                </div>
                <div class="field">
                    <label>Resume Link</label>
                    <input type="text" value="s3://CRM/AWL-30453.pdf" disabled>
                </div>
            </div>

            <!-- Right Side: The Greenhouse Form -->
            <div class="card">
                <h2>2. What the Bot Fills in Greenhouse</h2>
                <div class="field">
                    <label>First Name (Auto-Split)</label>
                    <input type="text" value="Yakub" disabled>
                </div>
                <div class="field">
                    <label>Last Name (Auto-Split)</label>
                    <input type="text" value="Ali Mohammed" disabled>
                </div>
                <div class="field">
                    <label>Require Sponsorship? (Derived from Visa)</label>
                    <select disabled><option selected>Yes (Because Visa is 'Other')</option></select>
                </div>
                <div class="field">
                    <label>Willing to Relocate? (ApplyWizz Rule)</label>
                    <select disabled><option selected>Yes (Override rule applied)</option></select>
                </div>
                <div class="field">
                    <label>Attached File</label>
                    <input type="text" value="resume_yakub-ali-mohammed.pdf" disabled>
                </div>
            </div>
        </div>
        
        <div class="btn">BOT ACTION: STEALTH SUBMIT (DISABLED IN SIMULATION)</div>
    </div>
</body>
</html>
